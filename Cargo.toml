[package]
name = "shrinker"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["Eduardo Amorim Pereira"]
description = "Lossless image compression for everyone"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eduardowebdev/shrinker"
readme = "README.md"
keywords = ["image", "compression", "lossless", "cli"]
categories = ["multimedia::images", "command-line-utilities"]

[lib]
name = "shrinker"
path = "src/lib.rs"

[[bin]]
name = "shrinker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
indicatif = "0.17"
oxipng = { version = "9.0", default-features = false, features = ["parallel", "zopfli"] }
rayon = "1.10"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
